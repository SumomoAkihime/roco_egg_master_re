name: Validate S5 Shiny Planner Preview

on:
  pull_request:
    paths:
      - "src/**"
      - "data/season-overlays/**"
      - "scripts/**"
      - "electron/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-shiny.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies (no install scripts)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm run test:shiny
      - name: Validate catalog dry-run script
        run: |\n          node --check scripts/import-season-data.cjs\n          node --check scripts/fetch-public-catalog.cjs
          node --check scripts/review-catalog-snapshot.cjs
          node --check electron/main.cjs
      - name: Test WIKI S5 parser and freshness gate
        run: node --test tests/importLiveWiki.test.cjs
      - name: Validate bundled S5 catalog
        run: node --test tests/s5Catalog.test.cjs
      - name: Probe current WIKI S5 source (advisory only)
        continue-on-error: true
        run: node scripts/import-live-wiki.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s5-wiki-preview
          path: data-candidates/s5-wiki-overlay.preview.json
          if-no-files-found: ignore
      - name: Vite production build
        run: npm run build
